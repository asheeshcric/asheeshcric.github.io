name: Update Citation Counts

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 6am UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update citations from Semantic Scholar
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}  # optional — add for higher rate limits
        run: python scripts/update_citations.py

      - name: Commit if changed
        run: |
          git config user.name  "Citation Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet index.html && echo "No changes to commit" && exit 0
          git add index.html
          STAMP=$(date -u '+%Y-%m-%d')
          git commit -m "chore: update citation counts [$STAMP] [skip ci]"
          git push
